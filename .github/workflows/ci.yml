name: AIVOA Full-Stack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Unit, Security & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite (Mock AI Provider Mode)
        env:
          GROQ_API_KEY: ""
          DATABASE_URL: "sqlite:///./test_ci.db"
        run: |
          pytest backend/tests -v --durations=10

      - name: Run AI Evaluation Benchmark (Mock Mode)
        env:
          GROQ_API_KEY: ""
        run: |
          python evaluation/evaluator.py

  frontend-tests:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Run TypeScript & Vite Production Build
        working-directory: frontend
        run: npm run build
